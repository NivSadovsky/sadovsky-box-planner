<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>סדובסקי בע״מ - מערכת תכנון אריזה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Heebo', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: white; padding: 24px;
    }
    .logo { font-size: 2.8rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px; text-align: center; }
    .logo span { color: #60a5fa; }
    .tagline { font-size: 1rem; color: #94a3b8; font-weight: 400; margin-bottom: 56px; text-align: center; }
    .cards { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 820px; }
    .choice-card {
      background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 40px 36px; width: 340px;
      cursor: pointer; text-decoration: none; color: white;
      transition: all .25s ease; display: flex; flex-direction: column;
      align-items: center; text-align: center; backdrop-filter: blur(10px);
    }
    .choice-card:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); transform: translateY(-4px); box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .choice-card .icon { font-size: 3.5rem; margin-bottom: 20px; line-height: 1; }
    .choice-card h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; }
    .choice-card p { font-size: .9rem; color: #94a3b8; line-height: 1.6; }
    .choice-card .arrow { margin-top: 28px; background: rgba(255,255,255,0.1); border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: background .2s; }
    .choice-card:hover .arrow { background: rgba(255,255,255,0.2); }
    .choice-card.box { border-color: rgba(96,165,250,0.35); }
    .choice-card.box:hover { border-color: rgba(96,165,250,0.7); box-shadow: 0 20px 60px rgba(37,99,235,0.25); }
    .choice-card.container { border-color: rgba(52,211,153,0.35); }
    .choice-card.container:hover { border-color: rgba(52,211,153,0.7); box-shadow: 0 20px 60px rgba(5,150,105,0.25); }
    footer { margin-top: 56px; font-size: .75rem; color: #475569; text-align: center; }
    @media (max-width: 720px) {
      .logo { font-size: 2rem; }
      .cards { flex-direction: column; align-items: center; }
      .choice-card { width: 100%; max-width: 400px; }
    }
  </style>
</head>
<body>
<div class="logo">📦 סדובסקי <span>בע״מ</span></div>
<p class="tagline">מערכת תכנון אריזה ולוגיסטיקה</p>
<div class="cards">
  <a class="choice-card box" href="box-planner.html">
    <div class="icon">🗃️</div>
    <h2>תכנון קרטון</h2>
    <p>חישוב מידות קרטון אופטימליות לאריזת מוצרים, עם תכנון סידור על משטחים</p>
    <div class="arrow">←</div>
  </a>
  <a class="choice-card container" href="container-planner.html">
    <div class="icon">🚢</div>
    <h2>תכנון מכולה</h2>
    <p>חישוב כמות קרטונים למכולה 20ft / 40ft HC — ישירות או על משטחים</p>
    <div class="arrow">←</div>
  </a>
</div>
<footer>כל הזכויות שמורות לניב סדובסקי © סדובסקי בע״מ</footer>
</body>
</html>
