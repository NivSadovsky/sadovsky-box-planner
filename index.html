<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>סדובסקי בע״מ - מתכנן קרטונים</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-dark:   #1a3a5c;
      --blue-mid:    #2563eb;
      --blue-light:  #dbeafe;
      --blue-pale:   #eff6ff;
      --gold:        #f59e0b;
      --gold-light:  #fef3c7;
      --green:       #059669;
      --green-light: #d1fae5;
      --teal:        #0d9488;
      --teal-light:  #ccfbf1;
      --gray-50:     #f8fafc;
      --gray-100:    #f1f5f9;
      --gray-200:    #e2e8f0;
      --gray-400:    #94a3b8;
      --gray-600:    #475569;
      --gray-800:    #1e293b;
      --radius:      12px;
      --shadow-sm:   0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
      --shadow-md:   0 4px 12px rgba(0,0,0,.10), 0 2px 4px rgba(0,0,0,.06);
      --shadow-lg:   0 10px 30px rgba(0,0,0,.12), 0 4px 8px rgba(0,0,0,.06);
    }

    body {
      font-family: 'Heebo', sans-serif;
      background: linear-gradient(135deg, #e0eaff 0%, #f0f4ff 50%, #e8f4fd 100%);
      min-height: 100vh;
      color: var(--gray-800);
      padding: 0 0 60px;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, var(--blue-dark) 0%, #1e4d8c 100%);
      color: #fff;
      padding: 28px 24px 24px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(26,58,92,.4);
    }
    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -.5px;
    }
    header p {
      margin-top: 6px;
      font-size: .95rem;
      opacity: .8;
      font-weight: 300;
    }

    /* ── Form card ── */
    .form-card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 28px 28px 24px;
      max-width: 760px;
      margin: 28px auto 0;
      width: calc(100% - 32px);
    }
    .form-card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--blue-dark);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-card h2::before {
      content: '';
      display: inline-block;
      width: 4px; height: 20px;
      background: var(--blue-mid);
      border-radius: 2px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px 24px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: .92rem;
      font-weight: 600;
      color: var(--gray-600);
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .field .unit {
      font-size: .72rem;
      font-weight: 400;
      color: var(--gray-400);
      text-transform: none;
    }
    .field input {
      border: 1.5px solid var(--gray-200);
      border-radius: 8px;
      padding: 11px 14px;
      font-family: 'Heebo', sans-serif;
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--gray-800);
      background: var(--gray-50);
      transition: border-color .2s, box-shadow .2s;
      direction: ltr;
      text-align: right;
    }
    .field input:focus {
      outline: none;
      border-color: var(--blue-mid);
      box-shadow: 0 0 0 3px rgba(37,99,235,.15);
      background: #fff;
    }
    .field input.error {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239,68,68,.12);
    }

    /* ── Pallet toggle ── */
    .pallet-toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      padding: 12px 14px;
      background: var(--gray-50);
      border-radius: 8px;
      border: 1.5px solid var(--gray-200);
      cursor: pointer;
      user-select: none;
    }
    .pallet-toggle-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--blue-mid);
      cursor: pointer;
      flex-shrink: 0;
    }
    .pallet-toggle-row label {
      font-size: .98rem;
      font-weight: 600;
      color: var(--blue-dark);
      cursor: pointer;
    }

    /* ── Pallet options ── */
    .pallet-options {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height .35s ease, opacity .3s ease, margin-top .3s ease;
      margin-top: 0;
    }
    .pallet-options.open {
      max-height: 600px;
      opacity: 1;
      margin-top: 14px;
    }
    .pallet-options-inner {
      background: var(--blue-pale);
      border: 1.5px solid var(--blue-light);
      border-radius: 10px;
      padding: 18px;
    }
    .pallet-options-inner h3 {
      font-size: .88rem;
      font-weight: 700;
      color: var(--blue-dark);
      margin-bottom: 12px;
      text-align: right;
    }

    /* Overhang info text */
    .overhang-info {
      font-size: .82rem;
      color: #475a8a;
      margin-bottom: 8px;
      text-align: right;
    }

    /* Type pills */
    .pallet-type-pills {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      justify-content: flex-end;
    }
    .pallet-pill {
      padding: 7px 18px;
      border-radius: 20px;
      border: 2px solid var(--blue-mid);
      background: #fff;
      color: var(--blue-mid);
      font-family: 'Heebo', sans-serif;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .18s, color .18s;
    }
    .pallet-pill.active, .pallet-pill:hover {
      background: var(--blue-mid);
      color: #fff;
    }

    /* Pallet dimension fields */
    .pallet-fields {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px 16px;
      margin-bottom: 14px;
    }
    .pallet-fields .field label {
      font-size: .82rem;
      text-transform: none;
      letter-spacing: 0;
    }
    .pallet-fields .field input {
      font-size: .98rem;
      padding: 9px 12px;
    }

    .overhang-row {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .overhang-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--blue-mid);
      cursor: pointer;
      flex-shrink: 0;
    }
    .overhang-row label {
      font-size: .9rem;
      font-weight: 500;
      color: var(--gray-600);
      cursor: pointer;
    }

    /* ── Calc button ── */
    .btn-calc {
      margin-top: 20px;
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--blue-mid), #1d4ed8);
      color: #fff;
      font-family: 'Heebo', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity .2s, transform .1s, box-shadow .2s;
      box-shadow: 0 4px 14px rgba(37,99,235,.4);
    }
    .btn-calc:hover { opacity: .92; box-shadow: 0 6px 18px rgba(37,99,235,.5); }
    .btn-calc:active { transform: scale(.99); }

    /* ── Error banner ── */
    .error-banner {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 14px;
      font-size: .88rem;
      color: #b91c1c;
      font-weight: 500;
      display: none;
    }
    .error-banner.visible { display: block; }

    /* ── Results section ── */
    .results-section {
      max-width: 1200px;
      margin: 32px auto 0;
      width: calc(100% - 32px);
    }
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .results-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--blue-dark);
    }
    .results-count {
      background: var(--blue-light);
      color: var(--blue-mid);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: .85rem;
      font-weight: 600;
    }

    /* ── Cards grid ── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 20px;
      position: relative;
      border: 1.5px solid transparent;
      transition: transform .2s, box-shadow .2s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }
    .card.rank-1 {
      border-color: var(--gold);
      background: linear-gradient(160deg, #fffbeb 0%, #fff 60%);
    }
    .card.rank-2 {
      border-color: #cbd5e1;
      background: linear-gradient(160deg, #f8fafc 0%, #fff 60%);
    }
    .card.rank-3 {
      border-color: #fed7aa;
      background: linear-gradient(160deg, #fff7ed 0%, #fff 60%);
    }

    /* Rank badge */
    .rank-badge {
      position: absolute;
      top: -1px;
      left: -1px;
      background: var(--gray-400);
      color: #fff;
      font-size: .72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius) 0 var(--radius) 0;
    }
    .card.rank-1 .rank-badge { background: linear-gradient(135deg, var(--gold), #d97706); }
    .card.rank-2 .rank-badge { background: linear-gradient(135deg, #94a3b8, #64748b); }
    .card.rank-3 .rank-badge { background: linear-gradient(135deg, #fb923c, #ea580c); }

    /* Arrangement pill */
    .arrangement {
      text-align: center;
      margin: 10px 0 14px;
    }
    .arrangement .fraction {
      display: inline-block;
      background: var(--blue-light);
      color: var(--blue-dark);
      border-radius: 20px;
      padding: 6px 18px;
      font-size: 1.2rem;
      font-weight: 700;
    }
    .card.rank-1 .arrangement .fraction {
      background: var(--gold-light);
      color: #92400e;
    }

    /* Pallet total highlight at top of card */
    .pallet-total-top {
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      border: 1.5px solid #6ee7b7;
      border-radius: 10px;
      padding: 10px 14px;
      text-align: center;
      margin-bottom: 10px;
    }
    .pallet-total-top .lbl-top {
      font-size: .82rem;
      font-weight: 600;
      color: #065f46;
      display: block;
      margin-bottom: 2px;
    }
    .pallet-total-top .val-top {
      font-size: 1.8rem;
      font-weight: 800;
      color: #047857;
      line-height: 1.1;
    }
    .card.rank-1 .pallet-total-top {
      background: linear-gradient(135deg, var(--gold-light), #fde68a);
      border-color: var(--gold);
    }
    .card.rank-1 .pallet-total-top .lbl-top { color: #78350f; }
    .card.rank-1 .pallet-total-top .val-top  { color: #b45309; }

    /* Footprint line */
    .footprint-row {
      text-align: center;
      font-size: .8rem;
      color: var(--gray-600);
      margin-bottom: 8px;
    }
    .footprint-row span {
      font-weight: 600;
      color: var(--gray-800);
    }

    /* Divider */
    .card-divider {
      border: none;
      border-top: 1px solid var(--gray-200);
      margin: 12px 0;
    }

    /* Data rows */
    .data-rows { display: flex; flex-direction: column; gap: 7px; }
    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: .96rem;
    }
    .data-row .lbl {
      color: var(--gray-600);
      font-weight: 400;
    }
    .data-row .val {
      font-weight: 600;
      color: var(--gray-800);
      direction: ltr;
      text-align: left;
    }

    /* Highlight rows */
    .highlight-row {
      background: var(--blue-pale);
      border-radius: 7px;
      padding: 7px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .highlight-row .lbl { font-weight: 600; color: var(--blue-dark); font-size: .96rem; }
    .highlight-row .val { font-weight: 700; color: var(--blue-mid); font-size: 1.1rem; direction: ltr; }
    .card.rank-1 .highlight-row { background: var(--gold-light); }
    .card.rank-1 .highlight-row .lbl { color: #78350f; }
    .card.rank-1 .highlight-row .val  { color: #b45309; }

    .highlight-row.green {
      background: var(--green-light) !important;
    }
    .highlight-row.green .lbl { color: #065f46 !important; }
    .highlight-row.green .val { color: var(--green) !important; }

    /* Pallet stats */
    .pallet-stats { display: flex; flex-direction: column; gap: 7px; }

    .pallet-no-fit {
      text-align: center;
      color: #b91c1c;
      font-weight: 600;
      font-size: .9rem;
      padding: 8px;
      background: #fef2f2;
      border-radius: 7px;
      border: 1px solid #fca5a5;
    }

    /* Best tag */
    .best-tag {
      text-align: center;
      margin-top: 12px;
    }
    .best-tag span {
      display: inline-block;
      background: linear-gradient(135deg, var(--green), #047857);
      color: #fff;
      font-size: .78rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: .3px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray-400);
      font-size: 1rem;
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 48px;
      color: var(--gray-400);
      font-size: .8rem;
    }

    /* ── Layout Modal ── */
    #layoutModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #layoutModal.open {
      display: flex;
    }
    .modal-box {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      padding: 24px;
      max-width: 480px;
      width: calc(100% - 32px);
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 32px;
      height: 32px;
      border: none;
      background: var(--gray-100);
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gray-600);
      transition: background .15s;
    }
    .modal-close:hover { background: var(--gray-200); }
    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--blue-dark);
      margin-bottom: 16px;
      text-align: center;
    }
    .modal-svg-wrap {
      background: var(--gray-50);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      justify-content: center;
    }
    .modal-svg-wrap svg {
      max-width: 100%;
    }
    .modal-summary {
      font-size: .88rem;
      color: var(--gray-600);
      text-align: center;
      line-height: 1.6;
      background: var(--blue-pale);
      border-radius: 7px;
      padding: 10px 14px;
    }
    .modal-summary strong {
      color: var(--blue-dark);
    }

    /* ── Load more button ── */
    .btn-load-more {
      display: block;
      margin: 24px auto;
      padding: 10px 32px;
      background: #fff;
      border: 2px solid var(--blue-mid);
      border-radius: 10px;
      color: var(--blue-mid);
      font-family: 'Heebo', sans-serif;
      font-size: .98rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .18s, color .18s, box-shadow .18s;
      box-shadow: var(--shadow-sm);
    }
    .btn-load-more:hover {
      background: var(--blue-mid);
      color: #fff;
      box-shadow: 0 4px 14px rgba(37,99,235,.3);
    }

    /* ── Isometric SVG ── */
    .iso-svg {
      display: block;
      width: 100%;
      margin: 8px 0 2px;
      border-radius: 8px;
      background: #f0f6ff;
    }
    .iso-label {
      font-size: .72rem;
      color: var(--gray-400);
      text-align: center;
      margin-bottom: 6px;
      direction: ltr;
    }

    .iso-legend {
      display: flex;
      justify-content: center;
      gap: 12px;
      font-size: .85rem;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .iso-legend span { display: flex; align-items: center; gap: 5px; }
    .iso-legend-dot {
      display: inline-block;
      width: 14px; height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* ── Pallet mini SVG ── */
    .pallet-mini-label {
      font-size: .78rem;
      color: var(--gray-600);
      font-weight: 600;
      text-align: right;
      margin-bottom: 4px;
      margin-top: 8px;
    }
    .pallet-mini-svg {
      display: block;
      width: 100%;
      margin: 4px 0;
      border-radius: 8px;
      background: var(--gray-50);
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr 1fr; }
      .cards-grid { grid-template-columns: 1fr; }
      .pallet-fields { grid-template-columns: 1fr 1fr; }
    }

    /* ── PDF Button ── */
    .pdf-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; margin-top: 14px;
      padding: 10px 0;
      background: #1e3a5f; color: white;
      border: none; border-radius: 10px;
      font-family: 'Heebo', sans-serif; font-size: .9rem; font-weight: 700;
      cursor: pointer; transition: background .2s;
    }
    .pdf-btn:hover { background: #16304f; }

    /* ── PDF Modal ── */
    .pdf-modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 2000;
      background: rgba(0,0,0,.55); align-items: center; justify-content: center;
    }
    .pdf-modal-overlay.open { display: flex; }
    .pdf-modal {
      background: white; border-radius: 16px; padding: 32px 28px;
      width: min(420px, 92vw); box-shadow: 0 20px 60px rgba(0,0,0,.3);
      direction: rtl; text-align: right;
    }
    .pdf-modal h3 { margin: 0 0 6px; font-size: 1.2rem; color: #1e3a5f; }
    .pdf-modal p  { margin: 0 0 20px; font-size: .85rem; color: #64748b; }
    .pdf-modal .field { margin-bottom: 14px; }
    .pdf-modal label { display: block; font-size: .85rem; font-weight: 600; color: #374151; margin-bottom: 5px; }
    .pdf-modal input {
      width: 100%; box-sizing: border-box;
      padding: 10px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-family: 'Heebo',sans-serif; font-size: .95rem; color: #1e293b;
    }
    .pdf-modal input:focus { outline: none; border-color: #2563eb; }
    .pdf-modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .pdf-modal-actions button {
      flex: 1; padding: 11px; border-radius: 10px; border: none;
      font-family: 'Heebo',sans-serif; font-size: .95rem; font-weight: 700; cursor: pointer;
    }
    .btn-pdf-confirm { background: #1e3a5f; color: white; }
    .btn-pdf-confirm:hover { background: #16304f; }
    .btn-pdf-cancel  { background: #f1f5f9; color: #374151; }
    .btn-pdf-cancel:hover { background: #e2e8f0; }

    /* ── Print Area ── */
    #print-area { display: none; }

    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      body > *:not(#print-area) { display: none !important; }
      #print-area {
        display: block !important;
        direction: rtl; font-family: 'Heebo', sans-serif;
        color: #1e293b; padding: 0; margin: 0;
      }
      .print-header {
        background: #1e3a5f; color: white;
        padding: 18px 24px; border-radius: 0;
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 20px;
      }
      .print-header h1 { margin: 0; font-size: 1.3rem; }
      .print-header .print-date { font-size: .8rem; opacity: .8; }
      .print-product-info {
        background: #f0f6ff; border: 1.5px solid #bfdbfe;
        border-radius: 10px; padding: 14px 18px; margin-bottom: 18px;
      }
      .print-product-info h2 { margin: 0 0 4px; font-size: 1.1rem; color: #1e3a5f; }
      .print-product-info .sku { font-size: .85rem; color: #64748b; }
      .print-section { margin-bottom: 18px; }
      .print-section h3 {
        font-size: .95rem; color: #1e3a5f; margin: 0 0 10px;
        border-bottom: 2px solid #e2e8f0; padding-bottom: 5px;
      }
      .print-row {
        display: flex; justify-content: space-between;

  </style>
</head>

<script>
  /* ── Helpers ── */
  const $ = id => document.getElementById(id);

  function mm2cm(v)  { return (v / 10).toFixed(1); }
  function mm2l(v)   { return (v / 1e6).toFixed(1); }
  function mm2cm3(v) { return (v / 1e3).toFixed(0); }

  function getFactorTriplets(n) {
    const triplets = [];
    for (let a = 1; a <= n; a++) {
      if (n % a !== 0) continue;
      const n2 = n / a;
      for (let b = 1; b <= n2; b++) {
        if (n2 % b !== 0) continue;
        const c = n2 / b;
        triplets.push([a, b, c]);
      }
    }
    return triplets;
  }

  function getOrientations(L, W, H) {
    return [
      [L, W, H], [L, H, W],
      [W, L, H], [W, H, L],
      [H, L, W], [H, W, L]
    ];
  }

  function ordinalHe(rank) {
    const map = {1:'מקום 1',2:'מקום 2',3:'מקום 3',4:'מקום 4',5:'מקום 5'};
    return map[rank] || `מקום ${rank}`;
  }

  /* ── Pallet UI ── */
  function togglePalletSection() {
    const cb  = $('enablePallet');
    const sec = $('palletOptions');
    if (event && event.target !== cb) {
      cb.checked = !cb.checked;
    }
    sec.classList.toggle('open', cb.checked);
  }

  function setPalletType(w, d, h, btn) {
    $('palW').value = w;
    $('palD').value = d;
    $('palH').value = h;
    document.querySelectorAll('.pallet-pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
  }

  /* ── Pallet calculation ── */
  function calcPalletForCarton(outerL, outerW, outerH, palW, palD, palH, noOverhang) {
    if (outerH > palH) return null;

    const ePalW = noOverhang ? palW : palW + 80;
    const ePalD = noOverhang ? palD : palD + 80;

    const cL = outerL;
    const cW = outerW;

    let best = null;
    let bestCount = -1;

    function tryArrangement(arrangement) {
      const total = arrangement.zoneA.count + arrangement.zoneB.count;
      if (total > bestCount) {
        bestCount = total;
        best = arrangement;
      }
    }

    // Split along pallet WIDTH — zone A has rows of (cL along x), zone B gets the remainder
    for (let k = 0; k <= Math.floor(ePalW / cL); k++) {
      const zA_xSpan = k * cL;
      const zA_cols  = Math.floor(ePalD / cW);
      const zA_count = k * zA_cols;
      const zB_rows  = Math.floor((ePalW - zA_xSpan) / cW);
      const zB_cols  = Math.floor(ePalD / cL);
      const zB_count = zB_rows * zB_cols;
      tryArrangement({
        splitAxis: 'W',
        zoneA: { x: 0, y: 0, w: zA_xSpan, h: ePalD, cartonW: cL, cartonH: cW, rows: k, cols: zA_cols, count: zA_count },
        zoneB: { x: zA_xSpan, y: 0, w: ePalW - zA_xSpan, h: ePalD, cartonW: cW, cartonH: cL, rows: zB_rows, cols: zB_cols, count: zB_count },
        effectivePalW: ePalW, effectivePalD: ePalD
      });
    }

    // Split along pallet WIDTH — zone B first (swap orientations)
    for (let k = 0; k <= Math.floor(ePalW / cW); k++) {
      const zA_xSpan = k * cW;
      const zA_cols  = Math.floor(ePalD / cL);
      const zA_count = k * zA_cols;
      const zB_rows  = Math.floor((ePalW - zA_xSpan) / cL);
      const zB_cols  = Math.floor(ePalD / cW);
      const zB_count = zB_rows * zB_cols;
      tryArrangement({
        splitAxis: 'W2',
        zoneA: { x: 0, y: 0, w: zA_xSpan, h: ePalD, cartonW: cW, cartonH: cL, rows: k, cols: zA_cols, count: zA_count },
        zoneB: { x: zA_xSpan, y: 0, w: ePalW - zA_xSpan, h: ePalD, cartonW: cL, cartonH: cW, rows: zB_rows, cols: zB_cols, count: zB_count },
        effectivePalW: ePalW, effectivePalD: ePalD
      });
    }

    // Split along pallet DEPTH
    for (let k = 0; k <= Math.floor(ePalD / cW); k++) {
      const zA_ySpan = k * cW;
      const zA_rows  = Math.floor(ePalW / cL);
      const zA_count = zA_rows * k;
      const zB_colsY = Math.floor((ePalD - zA_ySpan) / cL);
      const zB_rows  = Math.floor(ePalW / cW);
      const zB_count = zB_rows * zB_colsY;
      tryArrangement({
        splitAxis: 'D',
        zoneA: { x: 0, y: 0, w: ePalW, h: zA_ySpan, cartonW: cL, cartonH: cW, rows: zA_rows, cols: k, count: zA_count },
        zoneB: { x: 0, y: zA_ySpan, w: ePalW, h: ePalD - zA_ySpan, cartonW: cW, cartonH: cL, rows: zB_rows, cols: zB_colsY, count: zB_count },
        effectivePalW: ePalW, effectivePalD: ePalD
      });
    }

    // Split along pallet DEPTH — swapped orientations
    for (let k = 0; k <= Math.floor(ePalD / cL); k++) {
      const zA_ySpan = k * cL;
      const zA_rows  = Math.floor(ePalW / cW);
      const zA_count = zA_rows * k;
      const zB_colsY = Math.floor((ePalD - zA_ySpan) / cW);
      const zB_rows  = Math.floor(ePalW / cL);
      const zB_count = zB_rows * zB_colsY;
      tryArrangement({
        splitAxis: 'D2',
        zoneA: { x: 0, y: 0, w: ePalW, h: zA_ySpan, cartonW: cW, cartonH: cL, rows: zA_rows, cols: k, count: zA_count },
        zoneB: { x: 0, y: zA_ySpan, w: ePalW, h: ePalD - zA_ySpan, cartonW: cL, cartonH: cW, rows: zB_rows, cols: zB_colsY, count: zB_count },
        effectivePalW: ePalW, effectivePalD: ePalD
      });
    }

    const perLayer = bestCount >= 0 ? bestCount : 0;
    const layers   = Math.floor(palH / outerH);
    const total    = perLayer * layers;

    // Calculate actual footprint used by cartons
    let usedW = 0, usedD = 0;
    if (best) {
      const zA = best.zoneA;
      const zB = best.zoneB;
      const axis = best.splitAxis;
      if (axis === 'W' || axis === 'W2') {
        // Split along X (width) axis
        usedW = zA.rows * zA.cartonW + zB.rows * zB.cartonW;
        usedD = Math.max(
          zA.cols > 0 ? zA.cols * zA.cartonH : 0,
          zB.cols > 0 ? zB.cols * zB.cartonH : 0
        );
      } else {
        // Split along Y (depth) axis
        usedW = Math.max(
          zA.rows > 0 ? zA.rows * zA.cartonW : 0,
          zB.rows > 0 ? zB.rows * zB.cartonW : 0
        );
        usedD = zA.cols * zA.cartonH + zB.cols * zB.cartonH;
      }
      best.usedW = usedW;
      best.usedD = usedD;
    }

    return { perLayer, layers, total, arrangement: best, palW, palD, palH, noOverhang, ePalW, ePalD, usedW, usedD };
  }

  /* ── Main calculation ── */
  function calculate() {
    ['prodL','prodW','prodH','qty','thickness'].forEach(id => {
      const el = $(id);
      if (el) el.classList.remove('error');
    });
    $('errorBanner').classList.remove('visible');
    $('errorBanner').textContent = '';

    const inputs = ['prodL','prodW','prodH','qty','thickness'];
    const vals   = {};
    const errors = [];

    const uwEl = $('unitWeight');
    const unitWeightVal = uwEl && uwEl.value.trim() ? parseFloat(uwEl.value) : null;

    inputs.forEach(id => {
      const el = $(id);
      const v  = parseFloat(el.value);
      if (!el.value.trim() || isNaN(v) || v <= 0) {
        errors.push(labelOf(id));
        el.classList.add('error');
      } else {
        el.classList.remove('error');
        vals[id] = v;
      }
    });

    if (vals.qty && !Number.isInteger(vals.qty)) {
      errors.push('כמות המוצרים חייבת להיות מספר שלם');
      $('qty').classList.add('error');
    }

    // Pallet params
    const palletEnabled = $('enablePallet').checked;
    let palW, palD, palH, noOverhang;
    if (palletEnabled) {
      palW       = parseFloat($('palW').value);
      palD       = parseFloat($('palD').value);
      palH       = parseFloat($('palH').value);
      noOverhang = $('noOverhang').checked;
      if (isNaN(palW) || palW <= 0 || isNaN(palD) || palD <= 0 || isNaN(palH) || palH <= 0) {
        errors.push('מידות משטח');
      }
    }

    if (errors.length) {
      const fieldErrors = errors.filter(e => !e.includes('חייבת'));
      const otherErrors = errors.filter(e => e.includes('חייבת'));
      let msg = '';
      if (fieldErrors.length) msg += 'שגיאה: יש למלא את השדות הבאים בצורה תקינה: ' + fieldErrors.join(', ');
      if (otherErrors.length) msg += (msg ? ' · ' : '') + otherErrors.join(' · ');
      $('errorBanner').textContent = msg || errors.join(' · ');
      $('errorBanner').classList.add('visible');
      $('resultsSection').style.display = 'none';
      return;
    }

    const { prodL, prodW, prodH, qty, thickness: t } = vals;
    const qtyInt = Math.round(qty);

    const triplets     = getFactorTriplets(qtyInt);
    const orientations = getOrientations(prodL, prodW, prodH);
    const CARDBOARD_GSM = 550;

    const seen    = new Set();
    const results = [];

    for (const [d1, d2, d3] of orientations) {
      for (const [a, b, c] of triplets) {
        const outerL = a * d1 + 2 * t;
        const outerW = b * d2 + 2 * t;
        const outerH = c * d3 + 4 * t;

        const key = `${Math.min(outerL,outerW)}_${Math.max(outerL,outerW)}_${outerH}`;
        if (seen.has(key)) continue;
        seen.add(key);

        const volL   = (outerL * outerW * outerH) / 1e6;
        const areaM2 = (2*(outerL*outerH) + 2*(outerW*outerH) + 4*(outerL*outerW)) / 1e6;

        const netWeightG    = unitWeightVal !== null ? unitWeightVal * qtyInt : null;
        const cartonWeightG = areaM2 * CARDBOARD_GSM;
        const grossWeightG  = netWeightG !== null ? netWeightG + cartonWeightG : null;

        const result = { a, b, c, d1, d2, d3, outerL, outerW, outerH, volL, areaM2, netWeightG, cartonWeightG, grossWeightG };

        if (palletEnabled) {
          if (noOverhang) {
            // Only calculate without overhang
            result.pallet = calcPalletForCarton(outerL, outerW, outerH, palW, palD, palH, true);
            result.usedNoOverhang = true;
          } else {
            // Calculate both and pick the better one
            const palWith    = calcPalletForCarton(outerL, outerW, outerH, palW, palD, palH, false);
            const palWithout = calcPalletForCarton(outerL, outerW, outerH, palW, palD, palH, true);
            const totalWith    = palWith    ? palWith.total    : 0;
            const totalWithout = palWithout ? palWithout.total : 0;
            if (totalWithout >= totalWith) {
              result.pallet = palWithout;
              result.usedNoOverhang = true;
            } else {
              result.pallet = palWith;
              result.usedNoOverhang = false;
            }
          }
        }

        results.push(result);
      }
    }

    if (palletEnabled) {
      results.sort((x, y) => {
        const px = x.pallet ? x.pallet.total : -1;
        const py = y.pallet ? y.pallet.total : -1;
        if (py !== px) return py - px;
        // usedNoOverhang true ranks higher
        const nx = x.usedNoOverhang ? 1 : 0;
        const ny = y.usedNoOverhang ? 1 : 0;
        if (ny !== nx) return ny - nx;
        return x.volL - y.volL;
      });
    } else {
      results.sort((x, y) => {
        const dv = x.volL - y.volL;
        return dv !== 0 ? dv : x.areaM2 - y.areaM2;
      });
    }

    renderCards(results, palletEnabled, unitWeightVal);
  }

  function fmtWeight(grams) {
    if (grams === null) return null;
    if (grams >= 1000) return (grams / 1000).toFixed(2) + ' ק"ג';
    return grams.toFixed(0) + ' גרם';
  }

  function labelOf(id) {
    const map = { prodL:'אורך מוצר', prodW:'רוחב מוצר', prodH:'גובה מוצר', qty:'כמות מוצרים', thickness:'עובי קרטון' };
    return map[id] || id;
  }

  /* ── Global state for load more ── */
  let _allResults = [];
  let _palletEnabled = false;
  let _unitWeightVal = null;

  /* ── Render ── */
  function renderCards(results, palletEnabled, unitWeightVal) {
    _allResults = results;
    _palletEnabled = palletEnabled;
    _unitWeightVal = unitWeightVal;

    const grid = $('cardsGrid');
    grid.innerHTML = '';

    $('resultsCount').textContent = `${results.length} סידורים נמצאו`;
    $('resultsSection').style.display = 'block';

    if (results.length === 0) {
      grid.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>לא נמצאו סידורים</p></div>';
      $('loadMoreBtn').style.display = 'none';
      return;
    }

    const initial = Math.min(4, results.length);
    for (let i = 0; i < initial; i++) {
      grid.appendChild(buildCard(results[i], i + 1, palletEnabled, unitWeightVal));
    }

    const btn = $('loadMoreBtn');
    if (results.length > 4) {
      btn.textContent = `טען עוד סידורים (${results.length - 4} נוספים)`;
      btn.style.display = 'block';
    } else {
      btn.style.display = 'none';
    }
  }

  function loadMore() {
    const grid = $('cardsGrid');
    for (let i = 4; i < _allResults.length; i++) {
      grid.appendChild(buildCard(_allResults[i], i + 1, _palletEnabled, _unitWeightVal));
    }
    $('loadMoreBtn').style.display = 'none';
  }

  function buildCard(r, rank, palletEnabled, unitWeightVal) {
    const rankClass = rank <= 3 ? `rank-${rank}` : '';

    const innerL = r.a * r.d1;
    const innerW = r.b * r.d2;
    const innerH = r.c * r.d3;

    /* Pallet HTML block */
    let palletTotalTopHtml = '';
    let footprintHtml = '';
    let palletStatsHtml = '';
    let miniSvgHtml = '';

    if (palletEnabled) {
      const p = r.pallet;
      if (!p || p.total === 0) {
        palletStatsHtml = `
          <hr class="card-divider" />
          <div class="pallet-no-fit">הקרטון לא מתאים למשטח</div>
        `;
      } else {
        palletTotalTopHtml = `
          <div class="pallet-total-top">
            <span class="lbl-top">סך קרטונים במשטח</span>
            <div class="val-top">${p.total}</div>
          </div>
        `;

        if (p.usedW && p.usedD) {
          footprintHtml = `
            <div class="footprint-row">שטח בשימוש: <span>${p.usedW} × ${p.usedD} מ"מ</span></div>
          `;
        }

        const arrangementData = encodeURIComponent(JSON.stringify(p.arrangement));
        palletStatsHtml = `
          <hr class="card-divider" />
          <div class="pallet-stats">
            <div class="data-row">
              <span class="lbl">קרטונים בשכבה</span>
              <span class="val">${p.perLayer}</span>
            </div>
            <div class="data-row">
              <span class="lbl">מספר שכבות</span>
              <span class="val">${p.layers}</span>
            </div>
          </div>
        `;

        // Mini pallet SVG placeholder (will be filled after element appended)
        miniSvgHtml = `
          <div class="pallet-mini-label">פריסת משטח</div>
          <svg class="pallet-mini-svg" width="260" height="160" viewBox="0 0 260 160"
            data-arrangement="${arrangementData}"
            data-outerl="${r.outerL}" data-outerw="${r.outerW}" data-outerh="${r.outerH}"
            data-layers="${p.layers}" data-total="${p.total}" data-perlayer="${p.perLayer}"
            data-palw="${p.palW}" data-pald="${p.palD}" data-nooverhang="${p.noOverhang ? 1 : 0}"
            onclick="openLayoutFromMini(this)"
          ></svg>
        `;
      }
    }

    // Isometric SVG placeholder
    const isoHtml = `
      <svg class="iso-svg" width="260" height="195" viewBox="0 0 260 195"
        data-a="${r.a}" data-b="${r.b}" data-c="${r.c}"
        data-d1="${r.d1}" data-d2="${r.d2}" data-d3="${r.d3}"
      ></svg>
      <div class="iso-label">${r.a}×${r.b}×${r.c} | ${r.d1}×${r.d2}×${r.d3} מ"מ</div>
      <div class="iso-legend">
        <span><span class="iso-legend-dot" style="background:#2563eb"></span>${r.d1} מ"מ (×${r.a})</span>
        <span><span class="iso-legend-dot" style="background:#dc2626"></span>${r.d2} מ"מ (×${r.b})</span>
        <span><span class="iso-legend-dot" style="background:#059669"></span>${r.d3} מ"מ (×${r.c})</span>
      </div>
    `;

    const card = document.createElement('div');
    card.className = `card ${rankClass}`;

    card.innerHTML = `
      <div class="rank-badge">${ordinalHe(rank)}</div>

      <div class="arrangement">
        <span class="fraction">${r.a} × ${r.b} × ${r.c} מוצרים</span>
        <div style="font-size:.78rem; color:var(--gray-400); margin-top:5px;">
          מוצר: ${r.d1}×${r.d2}×${r.d3} מ"מ
        </div>
      </div>

      ${palletTotalTopHtml}
      ${footprintHtml}

      <hr class="card-divider" />

      <div class="data-rows">
        <div class="data-row">
          <span class="lbl">מרחב פנימי (מ"מ)</span>
          <span class="val">${innerL} × ${innerW} × ${innerH}</span>
        </div>
        <div class="data-row">
          <span class="lbl">מרחב פנימי (ס"מ)</span>
          <span class="val">${mm2cm(innerL)} × ${mm2cm(innerW)} × ${mm2cm(innerH)}</span>
        </div>

        <hr class="card-divider" />

        <div class="data-row">
          <span class="lbl">מידות חיצוניות (מ"מ)</span>
          <span class="val">${r.outerL} × ${r.outerW} × ${r.outerH}</span>
        </div>
        <div class="data-row">
          <span class="lbl">מידות חיצוניות (ס"מ)</span>
          <span class="val">${mm2cm(r.outerL)} × ${mm2cm(r.outerW)} × ${mm2cm(r.outerH)}</span>
        </div>
      </div>

      ${unitWeightVal !== null ? `
      <hr class="card-divider" style="margin-top:10px;" />
      <div class="data-rows" style="margin-top:4px;">
        <div class="data-row">
          <span class="lbl">משקל קרטון ריק</span>
          <span class="val">${fmtWeight(r.cartonWeightG)}</span>
        </div>
        <div class="data-row">
          <span class="lbl">משקל נטו (מוצרים)</span>
          <span class="val">${fmtWeight(r.netWeightG)}</span>
        </div>
      </div>
      <div class="highlight-row green" style="margin-top:8px;">
        <span class="lbl">משקל ברוטו</span>
        <span class="val">${fmtWeight(r.grossWeightG)}</span>
      </div>
      ` : ''}

      ${palletStatsHtml}

      ${isoHtml}
      ${miniSvgHtml}

      ${rank === 1 ? '<div class="best-tag"><span>✔ הסידור הטוב ביותר</span></div>' : ''}

      <button class="pdf-btn" onclick="openPdfModal(this)">📄 שמור PDF</button>
    `;

    // Store result data on card element for PDF export
    card._pdfData = { r, rank, palletEnabled, unitWeightVal, innerL, innerW, innerH };

    // Draw isometric after element created
    const isoSvg = card.querySelector('.iso-svg');
    if (isoSvg) {
      drawIsometric(isoSvg, r.a, r.b, r.c, r.d1, r.d2, r.d3);
    }

    // Draw mini pallet top-view
    const miniSvg = card.querySelector('.pallet-mini-svg');
    if (miniSvg) {
      const arrangement = JSON.parse(decodeURIComponent(miniSvg.dataset.arrangement));
      const noOvr = miniSvg.dataset.nooverhang === '1';
      drawPalletMini(miniSvg, arrangement, parseFloat(miniSvg.dataset.palw), parseFloat(miniSvg.dataset.pald), noOvr);
    }

    return card;
  }

  /* ── 3D Isometric — ציור קופסא עם צבע לפי מידה ── */

  // צבעים קבועים לשלושת הצירים
  const ISO_COLORS = {
    d1: { edge: '#2563eb', face: '#dbeafe', name: 'כחול'  },  // ציר W (ימין)
    d2: { edge: '#dc2626', face: '#fee2e2', name: 'אדום'  },  // ציר D (שמאל)
    d3: { edge: '#059669', face: '#d1fae5', name: 'ירוק'  },  // ציר H (גובה)
  };

  function buildIsoSvg(a, b, c, d1, d2, d3, SVG_W, SVG_H) {
    const C30 = Math.cos(Math.PI / 6);
    const S30 = Math.sin(Math.PI / 6);
    const PAD = 26;

    const W = a * d1;   // ציר ימין
    const D = b * d2;   // ציר שמאל
    const H = c * d3;   // ציר גובה

    // חישוב תחום ציור נורמלי
    const rawPts = [[0,0],[W*C30,W*S30],[-D*C30,D*S30],[0,-H],
                    [W*C30,W*S30-H],[-D*C30,D*S30-H],[(W-D)*C30,(W+D)*S30-H]];
    const allX = rawPts.map(p=>p[0]), allY = rawPts.map(p=>p[1]);
    const minX=Math.min(...allX), maxX=Math.max(...allX);
    const minY=Math.min(...allY), maxY=Math.max(...allY);

    let s = Math.min((SVG_W-PAD*2)/(maxX-minX), (SVG_H-PAD*2)/(maxY-minY)) * 0.82;
    if (!isFinite(s)||s<=0) s=0.2;

    // מיקום O במרכז — עם הזזה כלפי מטה קצת כי המקרא יתפוס מקום למעלה
    const cx = SVG_W/2 - (minX+(maxX-minX)/2)*s;
    const cy = SVG_H/2 - (minY+(maxY-minY)/2)*s + 10;

    const rX= C30*s, rY=S30*s;
    const lX=-C30*s, lY=S30*s;
    const uY=-s;

    const O  = [cx,             cy            ];
    const A  = [cx+W*rX,        cy+W*rY       ];
    const B  = [cx+D*lX,        cy+D*lY       ];
    const C_ = [cx,             cy+H*uY       ];
    const E  = [A[0],           A[1]+H*uY     ];
    const F  = [B[0],           B[1]+H*uY     ];
    const G  = [C_[0]+W*rX+D*lX,C_[1]+W*rY+D*lY];

    const fmt = p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`;
    const col1=ISO_COLORS.d1, col2=ISO_COLORS.d2, col3=ISO_COLORS.d3;

    // פאות — צבע בהיר מאוד, מסגרת בצבע הצלע הדומיננטית
    const face = (pts,fill,stroke) =>
      `<polygon points="${pts.map(fmt).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="2" stroke-linejoin="round"/>`;

    // קצות — קו עבה בצבע המידה
    const edge = (p1,p2,color,w=2.5) =>
      `<line x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;

    // גריד — קו דקיק בצבע המידה
    const grid = (p1,p2,color) =>
      `<line x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}" stroke="${color}" stroke-width="1" opacity="0.5"/>`;

    let svg = `<rect width="${SVG_W}" height="${SVG_H}" fill="#f8fafc" rx="8"/>`;

    // ── פאות (מאחורה לפני קצות) ──
    // צד שמאל: D=b*d2 (col2) × H=c*d3 (col3) — צבע לפי הרוחב (col2)
    svg += face([O,B,F,C_], col2.face, col2.edge);
    // צד ימין: W=a*d1 (col1) × H=c*d3 (col3) — צבע לפי הרוחב (col1)
    svg += face([O,A,E,C_], col1.face, col1.edge);
    // גג: W=a*d1 (col1) × D=b*d2 (col2) — גוון ניטרלי עם מסגרת
    svg += face([C_,E,G,F], '#e0f2fe', '#64748b');

    // ── גריד על צד ימין (col1 לאורך, col3 לגובה) ──
    for (let i=1;i<c;i++){const t=i/c; svg+=grid([O[0],O[1]+t*H*uY],[A[0],A[1]+t*H*uY],col3.edge);}
    for (let j=1;j<a;j++){const t=j/a; svg+=grid([O[0]+t*W*rX,O[1]+t*W*rY],[C_[0]+t*W*rX,C_[1]+t*W*rY],col1.edge);}

    // ── גריד על צד שמאל (col2 לאורך, col3 לגובה) ──
    for (let i=1;i<c;i++){const t=i/c; svg+=grid([O[0],O[1]+t*H*uY],[B[0],B[1]+t*H*uY],col3.edge);}
    for (let j=1;j<b;j++){const t=j/b; svg+=grid([O[0]+t*D*lX,O[1]+t*D*lY],[C_[0]+t*D*lX,C_[1]+t*D*lY],col2.edge);}

    // ── גריד על גג (col1 ו-col2) ──
    for (let j=1;j<a;j++){const t=j/a; svg+=grid([C_[0]+t*W*rX,C_[1]+t*W*rY],[F[0]+t*W*rX,F[1]+t*W*rY],col1.edge);}
    for (let i=1;i<b;i++){const t=i/b; svg+=grid([C_[0]+t*D*lX,C_[1]+t*D*lY],[E[0]+t*D*lX,E[1]+t*D*lY],col2.edge);}

    // ── קצות חיצוניים בצבע המידה שלהם ──
    // קצוות ציר W (d1 — כחול): O→A, C_→E, F→G, B→? (לא גלוי), top front
    svg += edge(O, A, col1.edge);
    svg += edge(C_, E, col1.edge);
    svg += edge(F, G, col1.edge);
    // קצוות ציר D (d2 — אדום): O→B, C_→F, A→? (לא גלוי), E→G
    svg += edge(O, B, col2.edge);
    svg += edge(C_, F, col2.edge);
    svg += edge(E, G, col2.edge);
    // קצוות ציר H (d3 — ירוק): O→C_, A→E, B→F
    svg += edge(O,  C_, col3.edge);
    svg += edge(A,  E,  col3.edge);
    svg += edge(B,  F,  col3.edge);

    // (no SVG legend — shown as HTML below the SVG)

    return svg;
  }

  function drawIsometric(svgEl, a, b, c, d1, d2, d3) {
    const SVG_W = 260, SVG_H = 195;
    const inner = buildIsoSvg(a, b, c, d1, d2, d3, SVG_W, SVG_H);
    svgEl.innerHTML = inner;
    // לחיצה לפתיחת מסך מלא
    svgEl.style.cursor = 'zoom-in';
    svgEl.onclick = () => openIsoFullscreen(a, b, c, d1, d2, d3);
  }

  function openIsoFullscreen(a, b, c, d1, d2, d3) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.75);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;';
    const svgW = Math.min(window.innerWidth - 40, 700);
    const svgH = Math.min(window.innerHeight - 80, 520);
    const inner = buildIsoSvg(a, b, c, d1, d2, d3, svgW, svgH);
    overlay.innerHTML = `<svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" style="border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);">${inner}</svg>`;
    overlay.onclick = () => document.body.removeChild(overlay);
    document.addEventListener('keydown', function esc(e){ if(e.key==='Escape'){ document.body.removeChild(overlay); document.removeEventListener('keydown',esc); }});
    document.body.appendChild(overlay);
  }

  /* ── Pallet Mini Top-View ── */
  function drawPalletMini(svgEl, arrangement, palW, palD, noOverhang) {
    const SVG_W = 260, SVG_H = 160;
    const PAD = 16;
    const drawW = SVG_W - PAD * 2;
    const drawH = SVG_H - PAD * 2;

    const ePalW = arrangement.effectivePalW || palW;
    const ePalD = arrangement.effectivePalD || palD;

    const scale = Math.min(drawW / ePalW, drawH / ePalD);
    const pxW   = ePalW * scale;
    const pxD   = ePalD * scale;
    const offX  = PAD + (drawW - pxW) / 2;
    const offY  = PAD + (drawH - pxD) / 2;

    function toX(mm) { return offX + mm * scale; }
    function toY(mm) { return offY + mm * scale; }

    let svg = '';

    // Pallet background
    svg += `<rect x="${offX}" y="${offY}" width="${pxW}" height="${pxD}" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1" rx="2"/>`;

    // Dashed inner pallet outline if overhang allowed
    if (!noOverhang) {
      const innerOffX = toX(40);
      const innerOffY = toY(40);
      const innerW    = palW * scale;
      const innerH    = palD * scale;
      svg += `<rect x="${innerOffX}" y="${innerOffY}" width="${innerW}" height="${innerH}" fill="none" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="4,3" rx="1"/>`;
    }

    // Zone A cartons (blue)
    const zA = arrangement.zoneA;
    if (zA && zA.rows > 0 && zA.cols > 0) {
      const cW = zA.cartonW * scale;
      const cH = zA.cartonH * scale;
      for (let row = 0; row < zA.rows; row++) {
        for (let col = 0; col < zA.cols; col++) {
          const cx = toX(zA.x + row * zA.cartonW);
          const cy = toY(zA.y + col * zA.cartonH);
          svg += `<rect x="${cx}" y="${cy}" width="${cW}" height="${cH}" fill="#3b82f6" stroke="#fff" stroke-width="0.8" rx="1"/>`;
        }
      }
      if (zA.count > 0) {
        const lx = toX(zA.x + zA.w / 2);
        const ly = toY(zA.y + zA.h / 2);
        svg += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-family="Heebo,sans-serif" font-size="11" font-weight="700">${zA.count}</text>`;
      }
    }

    // Zone B cartons (teal)
    const zB = arrangement.zoneB;
    if (zB && zB.rows > 0 && zB.cols > 0) {
      const cW = zB.cartonW * scale;
      const cH = zB.cartonH * scale;
      for (let row = 0; row < zB.rows; row++) {
        for (let col = 0; col < zB.cols; col++) {
          const cx = toX(zB.x + row * zB.cartonW);
          const cy = toY(zB.y + col * zB.cartonH);
          svg += `<rect x="${cx}" y="${cy}" width="${cW}" height="${cH}" fill="#0d9488" stroke="#fff" stroke-width="0.8" rx="1"/>`;
        }
      }
      if (zB.count > 0) {
        const lx = toX(zB.x + zB.w / 2);
        const ly = toY(zB.y + zB.h / 2);
        svg += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-family="Heebo,sans-serif" font-size="11" font-weight="700">${zB.count}</text>`;
      }
    }

    svgEl.innerHTML = svg;
  }

  function openLayoutFromMini(svgEl) {
    const arrangementJson = svgEl.dataset.arrangement;
    const outerL    = parseFloat(svgEl.dataset.outerl);
    const outerW    = parseFloat(svgEl.dataset.outerw);
    const outerH    = parseFloat(svgEl.dataset.outerh);
    const layers    = parseInt(svgEl.dataset.layers);
    const total     = parseInt(svgEl.dataset.total);
    const perLayer  = parseInt(svgEl.dataset.perlayer);
    const palW      = parseFloat(svgEl.dataset.palw);
    const palD      = parseFloat(svgEl.dataset.pald);
    const noOvr     = svgEl.dataset.nooverhang === '1' ? 1 : 0;
    showLayout(arrangementJson, outerL, outerW, outerH, layers, total, perLayer, palW, palD, noOvr);
  }

  /* ── Layout Modal ── */
  function showLayout(arrangementJson, outerL, outerW, outerH, layers, total, perLayer, palW, palD, noOverhangInt) {
    const arrangement = JSON.parse(decodeURIComponent(arrangementJson));
    const noOverhang  = noOverhangInt === 1;
    const ePalW = arrangement.effectivePalW;
    const ePalD = arrangement.effectivePalD;

    const SVG_W = 400, SVG_H = 320;
    const PAD   = 30;
    const drawW = SVG_W - PAD * 2;
    const drawH = SVG_H - PAD * 2;

    const scale = Math.min(drawW / ePalW, drawH / ePalD);
    const pxW   = ePalW * scale;
    const pxD   = ePalD * scale;
    const offX  = PAD + (drawW - pxW) / 2;
    const offY  = PAD + (drawH - pxD) / 2;

    function toSvgX(mm) { return offX + mm * scale; }
    function toSvgY(mm) { return offY + mm * scale; }

    let svg = '';

    // Pallet background
    svg += `<rect x="${offX}" y="${offY}" width="${pxW}" height="${pxD}" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5" rx="3"/>`;

    // Dashed inner line if overhang allowed
    if (!noOverhang) {
      const innerOffX = toSvgX(40);
      const innerOffY = toSvgY(40);
      const innerW    = palW * scale;
      const innerH    = palD * scale;
      svg += `<rect x="${innerOffX}" y="${innerOffY}" width="${innerW}" height="${innerH}" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,4" rx="2"/>`;
    }

    // Zone A cartons (blue)
    const zA = arrangement.zoneA;
    if (zA && zA.rows > 0 && zA.cols > 0) {
      const cW = zA.cartonW * scale;
      const cH = zA.cartonH * scale;
      for (let row = 0; row < zA.rows; row++) {
        for (let col = 0; col < zA.cols; col++) {
          const cx = toSvgX(zA.x + row * zA.cartonW);
          const cy = toSvgY(zA.y + col * zA.cartonH);
          svg += `<rect x="${cx}" y="${cy}" width="${cW}" height="${cH}" fill="#3b82f6" stroke="#fff" stroke-width="1" rx="1"/>`;
        }
      }
      if (zA.count > 0) {
        const lx = toSvgX(zA.x + zA.w / 2);
        const ly = toSvgY(zA.y + zA.h / 2);
        svg += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-family="Heebo,sans-serif" font-size="13" font-weight="700">${zA.count}</text>`;
      }
    }

    // Zone B cartons (teal)
    const zB = arrangement.zoneB;
    if (zB && zB.rows > 0 && zB.cols > 0) {
      const cW = zB.cartonW * scale;
      const cH = zB.cartonH * scale;
      for (let row = 0; row < zB.rows; row++) {
        for (let col = 0; col < zB.cols; col++) {
          const cx = toSvgX(zB.x + row * zB.cartonW);
          const cy = toSvgY(zB.y + col * zB.cartonH);
          svg += `<rect x="${cx}" y="${cy}" width="${cW}" height="${cH}" fill="#0d9488" stroke="#fff" stroke-width="1" rx="1"/>`;
        }
      }
      if (zB.count > 0) {
        const lx = toSvgX(zB.x + zB.w / 2);
        const ly = toSvgY(zB.y + zB.h / 2);
        svg += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-family="Heebo,sans-serif" font-size="13" font-weight="700">${zB.count}</text>`;
      }
    }

    // Dimension labels
    svg += `<text x="${offX + pxW / 2}" y="${offY + pxD + 18}" text-anchor="middle" fill="#374151" font-family="Heebo,sans-serif" font-size="11">${ePalW} מ"מ</text>`;
    svg += `<text x="${offX - 14}" y="${offY + pxD / 2}" text-anchor="middle" fill="#374151" font-family="Heebo,sans-serif" font-size="11" transform="rotate(-90, ${offX - 14}, ${offY + pxD / 2})">${ePalD} מ"מ</text>`;

    $('layoutSvg').innerHTML = svg;

    const zA2 = arrangement.zoneA;
    const zB2 = arrangement.zoneB;
    const zoneAStr = (zA2 && zA2.count > 0) ? `${zA2.rows}×${zA2.cols}` : null;
    const zoneBStr = (zB2 && zB2.count > 0) ? `${zB2.rows}×${zB2.cols}` : null;
    let layerDesc = [zoneAStr, zoneBStr].filter(Boolean).join(' + ');
    $('layoutSummary').innerHTML =
      `<strong>שכבה:</strong> ${layerDesc || '—'} | <strong>${perLayer} קרטונים בשכבה</strong> × ${layers} שכבות = <strong>${total} קרטונים</strong>`;

    $('layoutModal').classList.add('open');
  }

  function closeLayout() {
    $('layoutModal').classList.remove('open');
  }

  // Close modal on overlay click
  $('layoutModal').addEventListener('click', function(e) {
    if (e.target === this) closeLayout();
  });

  /* Allow Enter key to trigger calculation */
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') calculate();
  });

  /* ── PDF Export ── */
  let _pdfTargetCard = null;

  function openPdfModal(btn) {
    _pdfTargetCard = btn.closest('.card');
    $('pdfProductName').value = '';
    $('pdfSku').value = '';
    $('pdfModalOverlay').classList.add('open');
    setTimeout(() => $('pdfProductName').focus(), 80);
  }

  function closePdfModal() {
    $('pdfModalOverlay').classList.remove('open');
    _pdfTargetCard = null;
  }

  $('pdfModalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closePdfModal();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePdfModal();
  });

  function confirmPdf() {
    if (!_pdfTargetCard) return;
    const productName = $('pdfProductName').value.trim();
    const sku = $('pdfSku').value.trim();
    closePdfModal();
    buildAndPrintPdf(_pdfTargetCard, productName, sku);
  }

  function buildAndPrintPdf(card, productName, sku) {
    const { r, rank, palletEnabled, unitWeightVal, innerL, innerW, innerH } = card._pdfData;

    const today = new Date().toLocaleDateString('he-IL', { year:'numeric', month:'long', day:'numeric' });

    // Build isometric SVG for print (larger)
    const isoSvgStr = buildIsoSvg(r.a, r.b, r.c, r.d1, r.d2, r.d3, 320, 240);
    const col1 = ISO_COLORS.d1, col2 = ISO_COLORS.d2, col3 = ISO_COLORS.d3;

    // Pallet section
    let palletHtml = '';
    if (palletEnabled) {
      const p = r.pallet;
      if (!p || p.total === 0) {
        palletHtml = `<div class="section"><h3>🏗️ תכנון משטח</h3><p style="color:#ef4444;font-weight:600;margin-top:6px;">הקרטון לא מתאים למשטח</p></div>`;
      } else {
        const zonesHtml = (p.zones || []).map(z =>
          `<div class="row"><span class="lbl">אזור ${z.zoneLabel}: ${z.nx}×${z.ny} קרטונים</span><span class="val">${z.count} יח'</span></div>`
        ).join('');
        palletHtml = `
        <div class="section">
          <h3>🏗️ תכנון משטח</h3>
          <div class="pallet-highlight">
            <span class="lbl">סה"כ קרטונים במשטח</span>
            <span class="val">${p.total}</span>
          </div>
          ${p.layers ? `<div class="row"><span class="lbl">מספר שכבות</span><span class="val">${p.layers}</span></div>` : ''}
          ${p.perLayer ? `<div class="row"><span class="lbl">קרטונים בשכבה</span><span class="val">${p.perLayer}</span></div>` : ''}
          ${p.usedW ? `<div class="row"><span class="lbl">שטח בשימוש</span><span class="val">${p.usedW} × ${p.usedD} מ"מ</span></div>` : ''}
          ${zonesHtml}
        </div>`;
      }
    }

    // Weight section
    let weightHtml = '';
    if (unitWeightVal !== null) {
      weightHtml = `
        <div class="section">
          <h3>⚖️ משקלים</h3>
          <div class="row"><span class="lbl">משקל קרטון ריק</span><span class="val">${fmtWeight(r.cartonWeightG)}</span></div>
          <div class="row"><span class="lbl">משקל נטו (מוצרים)</span><span class="val">${fmtWeight(r.netWeightG)}</span></div>
          <div class="highlight">
            <span class="lbl">משקל ברוטו</span>
            <span class="val">${fmtWeight(r.grossWeightG)}</span>
          </div>
        </div>`;
    }

    const fullHtml = `<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8"/>
  <title>סדובסקי – ${productName || 'קרטון'}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { font-family: 'Heebo', sans-serif; color: #1e293b; direction: rtl; background: white; padding: 24px; }
    .print-header {
      background: #1e3a5f; color: white; padding: 16px 22px;
      border-radius: 10px; display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 18px;
    }
    .print-header h1 { font-size: 1.2rem; font-weight: 800; }
    .print-header .dt { font-size: .8rem; opacity: .8; }
    .product-info {
      background: #eff6ff; border: 1.5px solid #bfdbfe;
      border-radius: 10px; padding: 14px 18px; margin-bottom: 18px;
    }
    .product-info h2 { font-size: 1.1rem; color: #1e3a5f; margin-bottom: 3px; }
    .product-info .sub { font-size: .82rem; color: #64748b; margin-top: 2px; }
    .cols { display: flex; gap: 20px; align-items: flex-start; }
    .col-left { flex: 1.1; }
    .col-right { flex: 1; }
    .section { margin-bottom: 16px; }
    .section h3 {
      font-size: .9rem; color: #1e3a5f; font-weight: 700;
      border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; margin-bottom: 8px;
    }
    .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: .85rem; border-bottom: 1px solid #f1f5f9; }
    .row .lbl { color: #64748b; }
    .row .val { font-weight: 700; }
    .highlight {
      background: #f0fdf4; border: 1.5px solid #86efac;
      border-radius: 8px; padding: 9px 14px;
      display: flex; justify-content: space-between; margin-top: 8px;
    }
    .highlight .lbl { color: #15803d; font-weight: 600; }
    .highlight .val { font-weight: 800; color: #15803d; font-size: 1rem; }
    .pallet-highlight {
      background: #fefce8; border: 1.5px solid #fde68a;
      border-radius: 8px; padding: 9px 14px;
      display: flex; justify-content: space-between; margin-bottom: 8px;
    }
    .pallet-highlight .lbl { color: #92400e; font-weight: 600; }
    .pallet-highlight .val { font-weight: 800; color: #92400e; font-size: 1rem; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: .82rem; font-weight: 600; }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .legend-dot { display: inline-block; width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }
    .footer { margin-top: 24px; font-size: .72rem; color: #94a3b8; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 10px; }
    @media print {
      body { padding: 0; }
      @page { margin: 15mm; size: A4 portrait; }
    }
  </style>
</head>
<body>
  <div class="print-header">
    <h1>📦 סדובסקי בע״מ – מתכנן קרטונים</h1>
    <span class="dt">${today}</span>
  </div>

  <div class="product-info">
    <h2>${productName || 'ללא שם מוצר'}</h2>
    ${sku ? `<div class="sub">מק"ט: <strong>${sku}</strong></div>` : ''}
    <div class="sub">מידות מוצר: ${r.d1} × ${r.d2} × ${r.d3} מ"מ</div>
  </div>

  <div class="cols">
    <div class="col-left">
      <div class="section">
        <h3>📐 סידור בקרטון — ${r.a} × ${r.b} × ${r.c} מוצרים</h3>
        <div class="row"><span class="lbl">מרחב פנימי (מ"מ)</span><span class="val">${innerL} × ${innerW} × ${innerH}</span></div>
        <div class="row"><span class="lbl">מרחב פנימי (ס"מ)</span><span class="val">${mm2cm(innerL)} × ${mm2cm(innerW)} × ${mm2cm(innerH)}</span></div>
        <div class="row"><span class="lbl">מידות חיצוניות (מ"מ)</span><span class="val">${r.outerL} × ${r.outerW} × ${r.outerH}</span></div>
        <div class="row"><span class="lbl">מידות חיצוניות (ס"מ)</span><span class="val">${mm2cm(r.outerL)} × ${mm2cm(r.outerW)} × ${mm2cm(r.outerH)}</span></div>
      </div>
      ${weightHtml}
      ${palletHtml}
    </div>
    <div class="col-right">
      <div class="section">
        <h3>🗂️ ציור תלת-ממדי</h3>
        <svg width="100%" viewBox="0 0 320 240" style="display:block;border-radius:8px;background:#f8fafc;">${isoSvgStr}</svg>
        <div class="legend" style="margin-top:10px;">
          <span><span class="legend-dot" style="background:${col1.edge}"></span>${r.d1} מ"מ (×${r.a})</span>
          <span><span class="legend-dot" style="background:${col2.edge}"></span>${r.d2} מ"מ (×${r.b})</span>
          <span><span class="legend-dot" style="background:${col3.edge}"></span>${r.d3} מ"מ (×${r.c})</span>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">כל הזכויות שמורות לניב סדובסקי © | סדובסקי בע״מ – מתכנן קרטונים</div>

  <script>window.onload = function(){ window.print(); };<\/script>
</body>
</html>`;

    const win = window.open('', '_blank', 'width=900,height=700');
    if (!win) {
      alert('אנא אפשר חלונות קופצים בדפדפן כדי להפיק PDF');
      return;
    }
    win.document.open();
    win.document.write(fullHtml);
    win.document.close();
  }
</script>

</body>
</html>
